name: nexttree-tools

x-node-dev: &node-dev
  image: node:22-bookworm-slim
  working_dir: /workspace
  volumes:
    - ../..:/workspace
    - pnpm-store:/pnpm/store
  environment:
    PNPM_HOME: /pnpm
    NPM_CONFIG_STORE_DIR: /pnpm/store
    PATH: /pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

services:
  workspace:
    <<: *node-dev
    command: sh -lc "corepack enable && sleep infinity"

  deps:
    <<: *node-dev
    command: sh -lc "corepack enable && CI=true pnpm install --frozen-lockfile=false"
    profiles:
      - app

  frontend:
    <<: *node-dev
    working_dir: /workspace/apps/biwa-counter/frontend
    command: sh -lc "corepack enable && pnpm dev --host 0.0.0.0 --port 3000"
    depends_on:
      deps:
        condition: service_completed_successfully
    ports:
      - "13700:3000"
    environment:
      PNPM_HOME: /pnpm
      NPM_CONFIG_STORE_DIR: /pnpm/store
      PATH: /pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      NUXT_PUBLIC_API_BASE_URL: http://localhost:13701
    profiles:
      - app

  backend:
    <<: *node-dev
    working_dir: /workspace/apps/biwa-counter/backend
    command: sh -lc "corepack enable && pnpm dev"
    depends_on:
      deps:
        condition: service_completed_successfully
    ports:
      - "13701:8787"
    environment:
      PNPM_HOME: /pnpm
      NPM_CONFIG_STORE_DIR: /pnpm/store
      PATH: /pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PORT: "8787"
    profiles:
      - app

volumes:
  pnpm-store:
